*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;max-width:1440px;margin:auto}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,56px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(23,26,25,.94);backdrop-filter:blur(16px);z-index:10}.brand{display:flex;align-items:center;gap:12px;letter-spacing:.16em;font-size:11px;font-weight:800}.seal{width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-size:18px}.top-right{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.iconbtn,.navbtn,.ghost,.primary,.chip,.tab{border:0}.iconbtn{background:transparent;color:var(--paper);font-size:20px;padding:8px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px)}.sidebar{border-right:1px solid var(--line);padding:30px 16px;display:flex;flex-direction:column;gap:7px}.navlabel{font-size:9px;letter-spacing:.2em;color:#8f887b;padding:14px 12px 7px}.navbtn{background:transparent;color:#b9b1a2;text-align:left;padding:12px;border-radius:7px;display:flex;gap:12px;align-items:center;font-size:13px;transition:.2s}.navbtn .ico{width:18px;text-align:center;color:var(--gold)}.navbtn.active,.navbtn:hover{background:#2a2d29;color:var(--paper)}.sidebar-note{margin-top:auto;border-top:1px solid var(--line);padding:18px 12px;color:#958d7e;font:italic 14px/1.5 var(--serif)}main{min-width:0;padding:clamp(22px,4vw,56px)}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}.hero{position:relative;min-height:360px;display:flex;align-items:flex-end;padding:clamp(24px,5vw,54px);overflow:hidden;background:linear-gradient(90deg,rgba(12,16,15, -radius:5px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold);width:0}.mobile-nav{display:none}.hide{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#eee8da;color:#171a19;padding:10px 16px;border-radius:4px;font-size:12px;z-index:50;box-shadow:0 8px 30px #0006}.map-placeholder{background:linear-gradient(135deg,#3a4038,#252b28);min-height:270px;position:relative;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center}.map-placeholder:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(28deg,transparent 0 34px,rgba(218,202,164,.12) 35px 36px),repeating-linear-gradient(112deg,transparent 0 55px,rgba(218,202,164,.09) 56px 57px);transform:rotate(-8deg)}.map-label{position:relative;background:#171a19dd;border:1px solid var(--gold);padding:9px 12px;color:var(--gold2);font:14px var(--serif)}.footer{border-top:1px solid var(--line);margin-top:45px;padding:22px 0;color:#817a6e;font-size:10px;letter-spacing:.1em}.mobile-title{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{display:none}main{padding:20px 16px 100px}.topbar{height:60px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(23,26,25,.97);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(15px)}.mobile-nav .navbtn{display:flex;flex-direction:column;gap:2px;font-size:9px;padding:7px 9px}.mobile-nav .ico{font-size:17px}.hero{min-height:390px;padding:25px 21px}.grid3{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:12px 9px}.stat strong{font-size:25px}.stat span{font-size:8px}.lesson-layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.top-right .date{display:none}.sectionhead{margin-top:29px}.article p{font-size:15px}.mobile-title{display:block}}
@media(min-width:851px){.mobile-nav{display:none}}
</style>

<script>
const SUPABASE_URL = "https://oofmuwankwbqvqksfssk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3IgDys9pFnPF5OcknBzyWA_kS7sZqa2";
const editions = [{
 id:"001",date:"18 November 2026",title:"Nelson at Trafalgar",subtitle:"The commander who changed the geometry of naval warfare",period:"Napoleonic Wars",theme:"Initiative · Disruption · Command",minutes:18,
 image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=85",
 lead:"On 21 October 1805, off the coast of Spain, two fleets converged in a contest that would decide who commanded the sea. Horatio Nelson entered the battle with a plan that rejected the comfortable logic of the line—and accepted extraordinary personal risk.",
 sections:[
 {heading:"The world before Trafalgar",body:"Britain's survival as a great power depended on command of the sea. Napoleon's France dominated much of continental Europe, but an invasion of Britain required control of the Channel and the defeat or neutralisation of the Royal Navy. The Franco-Spanish fleet offered Napoleon a possible instrument for changing the balance. Trafalgar was therefore not simply a fleet action: it was a collision between continental ambition and Britain's maritime shield."},
 {heading:"The man behind the signal",body:"Nelson's command style was shaped by years at sea, hard campaigning and a close-knit network of officers who understood his intentions. He valued initiative and trust. His captains were expected to act intelligently when communications failed, rather than wait passively for instructions. This approach—later associated with mission command—was not a modern invention, but Nelson made it unusually effective through relationships, rehearsal and shared purpose."},
 {heading:"The geometry of the attack",body:"Conventional naval doctrine favoured opposing fleets sailing in parallel lines and exchanging broadsides. Nelson instead divided his fleet into two columns and drove them into the allied line at near right angles. The approach exposed the British ships to fire as they closed, but promised to rupture the enemy formation, create local superiority and make coordinated response difficult. It was a calculated exchange: accept concentrated danger briefly to create decisive disorder."},
 {heading:"Victory and its price",body:"The British victory was decisive. The combined fleet lost ships and the capacity to challenge British command of the sea in the same way. Yet Nelson was shot by a French marksman and died aboard HMS Victory. His death became part of the story, but the deeper legacy lay in the system he had built: trained captains, delegated initiative, clear intent and a willingness to act before the opponent could recover."}
 ],
 timeline:[
 ["06:00","The fleets prepare","The British fleet closes with the combined Franco-Spanish force off Cape Trafalgar."],
 ["11:45","The signal is hoisted","Nelson's famous signal—“England expects that every man will do his duty”—is sent from HMS Victory."],
 ["12:00","The lines are broken","British columns penetrate the allied line, producing close and confused fighting."],
 ["Afternoon","The battle turns","The allied fleet is defeated. Nelson is mortally wounded and dies later that day."]
 ],
 question:"Why did Nelson accept the danger of approaching the enemy line under fire?",
 options:["Because he believed speed and surprise would create local superiority and break coordination.","Because British ships had longer-range guns and could safely remain outside enemy range.","Because he wanted to preserve a perfectly parallel formation."],
 answer:0,
 explanation:"Nelson traded short-term exposure for the chance to rupture the enemy's formation. The central idea was to create a decisive local advantage before the opposing fleet could respond coherently.",
 principle:"Concentrate strength at the decisive point. A force that is stronger everywhere in theory may be weaker at the point and moment that matter.",
 modern:"In business, a smaller team can challenge an incumbent by focusing resources on one neglected customer need or bottleneck—provided it understands the risk of the concentrated move."
}];
let state={page:"home",edition:0,completed:JSON.parse(localStorage.getItem("ms_completed")||"[]"),bookmarks:JSON.parse(localStorage.getItem("ms_bookmarks")||"[]"),notes:JSON.parse(localStorage.getItem("ms_notes")||"{}"),decision:null,showAnswer:false,timeline:0};
const app=document.getElementById("app");
const e=()=>editions[state.edition];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){let el=document.getElementById("toast");el.textContent=t;el.classList.remove("hide");setTimeout(()=>el.classList.add("hide"),2100)}
function go(page){state.page=page;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render();window.scrollTo(0,0)}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function render(){
 const pages={home:home,lesson:lesson,library:library,atlas:atlas,gym:gym,journal:journal};
 app.innerHTML=(pages[state.page]||home)();
}
async function syncPublishedEditions(){
 const label=document.getElementById("streakLabel");
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/editions?select=id,edition_date,title,content,published_at&published_at=not.is.null&order=published_at.desc`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY},cache:"no-store"});
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const rows=await res.json();
  let added=0;
  for(const row of rows){
   if(!row.content||!row.content.id||!row.content.title)continue;
   const lesson={...row.content,id:String(row.content.id),date:row.edition_date||row.content.date||"",image:row.content.image||row.content.image_url||""};
   const at=editions.findIndex(x=>String(x.id)===String(lesson.id));
   if(at>=0)editions[at]=lesson;else{editions.push(lesson);added++;}
  }
  editions.sort((a,b)=>Date.parse(b.date||"")-Date.parse(a.date||""));
  state.edition=0;
  label.textContent=`SYNCED · ${rows.length} EDITION${rows.length===1?"":"S"}`;
  label.title="Published editions are syncing from the Morning Strategist cloud library.";
  if(added&&state.page!="lesson")render();
 }catch(err){
  label.textContent="OFFLINE / LOCAL";
  label.title=`Cloud sync failed: ${err.message}. The bundled edition remains available.`;
 }
}
function home(){
 const x=e(),done=state.completed.includes(x.id);
 const rawDate=String(x.date||"");
 const iso=/^\\d{4}-\\d{2}-\\d{2}$/.test(rawDate)?rawDate:(()=>{const m=rawDate.match(/^(\\d{1,2}) ([A-Za-z]+) (\\d{4})$/);return m?new Date(Date.parse(m[2]+" 1, "+m[3])).getFullYear()+"-"+String(new Date(Date.parse(m[2]+" 1, "+m[3])).getMonth()+1).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0"):"";})();
 const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
 const isToday=iso===today;
 const dateLabel=iso?new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(iso+"T12:00:00Z")):"Date to be confirmed";
 const sections=x.sections||[];
 return `
 <div class="academy-kicker"><span>THE EDITORIAL ACADEMY</span><span class="kicker-rule"></span><span>${isToday?"TODAY'S EDITION":"LATEST PUBLISHED EDITION"}</span></div>
 <section class="today-hero" style="--hero-image:url('${esc(x.image||"")}')">
  <div class="today-hero-shade"></div><div class="today-hero-copy">
   <div class="edition-mark">EDITION ${esc(x.id)} <i>·</i> ${esc(x.period||"HISTORY & STRATEGY")}</div>
   <h1>${esc(x.title||"The Morning Strategist")}</h1>
   <p class="hero-deck">${esc(x.subtitle||"A daily study of history, power and strategic judgement.")}</p>
   <div class="hero-byline"><span>${esc(dateLabel)}</span><span>${esc(x.minutes||15)} MIN READ</span><span>${sections.length||1} CHAPTERS</span></div>
   <div class="hero-actions"><button class="primary" onclick="go('lesson')">${done?"CONTINUE READING":"READ THE MASTERCLASS"} <b>→</b></button><button class="hero-save" onclick="toggleBookmark('${esc(x.id)}')">${state.bookmarks.includes(x.id)?"★ SAVED":"☆ SAVE EDITION"}</button></div>
  </div>
 </section>
 <div class="home-intro-grid">
  <section class="editorial-intro"><div class="section-index">01 / THE DAILY STUDY</div><h2>History teaches us<br><em>to see further.</em></h2><p>Go beyond the familiar account. Enter the world behind the event, understand the person behind the decision, and examine the choices that changed the course of history.</p><button class="text-link" onclick="go('lesson')">Begin today's study <span>↗</span></button></section>
  <aside class="academy-progress"><div class="section-index">YOUR ACADEMY</div><div class="progress-stat"><strong>${state.completed.length}</strong><span>MASTERCLASSES<br>COMPLETED</span></div><div class="thin-rule"></div><div class="progress-stat"><strong>${state.bookmarks.length}</strong><span>EDITIONS<br>BOOKMARKED</span></div><div class="thin-rule"></div><div class="progress-stat"><strong>${Object.keys(state.notes).filter(k=>state.notes[k]).length}</strong><span>REFLECTIONS<br>RECORDED</span></div></aside>
 </div>
 <section class="home-feature"><div class="section-index">02 / INSIDE THIS MASTERCLASS</div><div class="feature-grid"><div><h2>The story behind<br><em>the strategy.</em></h2><p>${esc(x.lead||"Explore the historical forces, personal character and decisions behind this defining moment.")}</p><button class="text-link" onclick="go('lesson')">Explore the chapters <span>→</span></button></div><div class="chapter-teaser-list">${sections.slice(0,4).map((s,i)=>`<button class="chapter-teaser" onclick="go('lesson')"><span>0${i+1}</span><strong>${esc(s.heading)}</strong><b>↗</b></button>`).join("")||'<p class="muted">The next chapter will appear here.</p>'}</div></div></section>
 <section class="academy-pathways"><div class="section-index">03 / CONTINUE YOUR STUDIES</div><div class="pathway-grid">
  <button class="pathway-card" onclick="go('library')"><span>THE ARCHIVE</span><strong>The Library</strong><small>Return to the people, events and ideas that shaped history.</small><b>Explore ↗</b></button>
  <button class="pathway-card" onclick="go('atlas')"><span>GEOGRAPHY OF POWER</span><strong>Strategic Atlas</strong><small>Understand how terrain, distance and position shape power.</small><b>Explore ↗</b></button>
  <button class="pathway-card" onclick="go('gym')"><span>JUDGEMENT UNDER PRESSURE</span><strong>Strategy Gym</strong><small>Test your reasoning against difficult strategic choices.</small><b>Train ↗</b></button>
  <button class="pathway-card" onclick="go('journal')"><span>PRIVATE NOTEBOOK</span><strong>My Journal</strong><small>Keep the observations and principles worth remembering.</small><b>Reflect ↗</b></button>
 </div></section>
 <footer class="academy-footer">THE MORNING STRATEGIST <span>THINK CLEARLY. SEE FURTHER. ACT DECISIVELY.</span></footer>`;
}
function renderVisuals(x){return (x.visuals||[]).filter(v=>v.url&&/^https:\/\//i.test(v.url)).map(v=>`<figure style="margin:18px 0"><img src="${esc(v.url)}" alt="${esc(v.alt||v.caption||'Historical visual')}" style="width:100%;max-height:430px;object-fit:contain;background:#111"><figcaption class="muted small" style="margin-top:7px">${esc(v.caption||'')}</figcaption></figure>`).join("")}
function renderVideos(x){return (x.videos||[]).filter(v=>v.url&&/^https:\/\//i.test(v.url)).map(v=>`<div class="panel" style="margin:10px 0"><div class="tag">${esc(v.channel||'VIDEO')}</div><h3>${esc(v.title||'Historical video')}</h3><p class="muted small">${esc(v.relevance||v.description||'')}</p><a class="ghost" style="display:inline-block;text-decoration:none" href="${esc(v.url)}" target="_blank" rel="noopener">WATCH VIDEO ↗</a></div>`).join("")}
function renderSources(x){return (x.sources||[]).filter(v=>v.url&&/^https:\/\//i.test(v.url)).map(v=>`<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title||v.url)}</a> <span class="muted small">${esc(v.type||'')}</span></li>`).join("")}
function lesson(){
 const x=e(),done=state.completed.includes(x.id),sections=x.sections||[];
 const chapterNav=sections.map((s,i)=>`<a href="#chapter-${i+1}"><span>0${i+1}</span>${esc(s.heading)}</a>`).join("");
 const chapterBody=sections.map((s,i)=>`<section class="reading-chapter" id="chapter-${i+1}"><div class="chapter-overline">CHAPTER 0${i+1}</div><h2>${esc(s.heading)}</h2><p>${esc(s.body)}</p>${s.visuals?.length?s.visuals.map(v=>`<figure class="chapter-figure"><img src="${esc(v.url)}" alt="${esc(v.alt||v.caption||"Historical image")}"><figcaption>${esc(v.caption||"")}</figcaption></figure>`).join(""):""}</section>`).join("");
 return `
 <div class="reading-topline"><button class="back-link" onclick="go('home')">← THE ACADEMY</button><span>EDITION ${esc(x.id)} · ${esc(x.period)}</span><span>${esc(x.minutes||15)} MIN READ</span></div>
 <header class="reading-cover">
  <div class="reading-cover-image" style="background-image:url('${esc(x.image||"")}')"></div><div class="reading-cover-content"><div class="section-index">THE MORNING STRATEGIST · MASTERCLASS ${esc(x.id)}</div><h1>${esc(x.title)}</h1><p class="reading-subtitle">${esc(x.subtitle||"")}</p><p class="reading-lead">${esc(x.lead||"")}</p><div class="reading-cover-meta">${esc(x.period||"")} <i>·</i> ${esc(x.minutes||15)} MINUTES <i>·</i> ${sections.length} CHAPTERS</div></div>
 </header>
 <div class="reading-controls"><button class="ghost" onclick="toggleBookmark('${esc(x.id)}')">${state.bookmarks.includes(x.id)?"★ BOOKMARKED":"☆ BOOKMARK"}</button><button class="ghost" onclick="shareEdition()">↗ SHARE</button><span class="reading-status">${done?"✓ MASTERCLASS COMPLETED":"A STUDY IN STRATEGIC JUDGEMENT"}</span></div>
 <div class="reading-layout"><aside class="chapter-index"><div class="section-index">IN THIS MASTERCLASS</div><nav>${chapterNav}</nav><div class="reading-index-note">Read slowly. The historical detail is where the judgement begins.</div></aside>
 <article class="editorial-article">
  <section class="editor-briefing"><div class="chapter-overline">THE EDITOR'S BRIEFING</div><h2>The question beneath the story</h2><p>${esc(x.briefing?.centralQuestion||x.question||"What did the decision-maker understand about the situation that others failed to see?")}</p><p class="briefing-context">${esc(x.briefing?.stakes||"As you read, pay attention to the pressures of the period, the limits of available information and the consequences that followed.")}</p></section>
  ${chapterBody}
  ${x.quote?`<blockquote class="editorial-quote">“${esc(x.quote.text||x.quote)}”<cite>— ${esc(x.quote.attribution||"")}</cite></blockquote>`:""}
  ${renderVisuals(x)}
  ${x.timeline?.length?`<section class="reading-extra"><div class="chapter-overline">THE CHRONOLOGY</div><h2>The event, moment by moment</h2><div class="timeline">${x.timeline.map((it,i)=>`<button class="timeitem ${i===state.timeline?"selected":""}" onclick="state.timeline=${i};render()"><b>${esc(it[0])}</b><strong>${esc(it[1])}</strong>${i===state.timeline?`<p>${esc(it[2])}</p>`:""}</button>`).join("")}</div></section>`:""}
  <section class="reading-extra strategic-anatomy"><div class="chapter-overline">THE STRATEGIC ANATOMY</div><h2>The principle beneath the decision</h2><h3>${esc(x.principle||"")}</h3><p>${esc(x.strategicAnatomy||"Examine the decision in the context of the information, constraints, relationships and risks available at the time.")}</p>${x.philosophical?`<h3>The philosophical dimension</h3><p>${esc(x.philosophical)}</p>`:""}</section>
  <section class="reading-extra modern-parallel"><div class="chapter-overline">A SHORT MODERN PARALLEL</div><h2>Where the principle appears today</h2><p>${esc(x.modern||"")}</p></section>
  ${x.videos?.length?`<section class="reading-extra"><div class="chapter-overline">THE VISUAL ARCHIVE</div><h2>Watch the history</h2>${renderVideos(x)}</section>`:""}
  ${x.paths?.length?`<section class="reading-extra"><div class="chapter-overline">FURTHER INVESTIGATION</div><h2>Five paths to explore</h2><div class="panel"><ol>${x.paths.map(v=>`<li style="margin:9px 0">${esc(v.label||"Explore")}: ${v.url&&/^https:\/\//i.test(v.url)?`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title||v.url)}</a>`:esc(v.prompt||v.title||"Continue the investigation")}</li>`).join("")}</ol></div></section>`:""}
  ${x.readingRoom?`<section class="reading-extra"><div class="chapter-overline">THE READING ROOM</div><h2>Go deeper</h2><div class="panel">${x.readingRoom.book?`<p><b>Book:</b> ${esc(x.readingRoom.book.title||"")} — ${esc(x.readingRoom.book.why||"")}${x.readingRoom.book.url&&/^https:\/\//i.test(x.readingRoom.book.url)?` <a href="${esc(x.readingRoom.book.url)}" target="_blank" rel="noopener">Open ↗</a>`:""}</p>`:""}${x.readingRoom.documentary?`<p><b>Documentary / lecture:</b> ${esc(x.readingRoom.documentary.title||"")} — ${esc(x.readingRoom.documentary.why||"")}${x.readingRoom.documentary.url&&/^https:\/\//i.test(x.readingRoom.documentary.url)?` <a href="${esc(x.readingRoom.documentary.url)}" target="_blank" rel="noopener">Watch ↗</a>`:""}</p>`:""}${(x.readingRoom.online_resources||[]).map(v=>`<p><b>Online resource:</b> ${esc(v.title||"")} — ${esc(v.why||"")} ${v.url&&/^https:\/\//i.test(v.url)?`<a href="${esc(v.url)}" target="_blank" rel="noopener">Read ↗</a>`:""}</p>`).join("")}</div></section>`:""}
  ${x.sources?.length?`<section class="reading-extra"><div class="chapter-overline">HISTORICAL RECORD</div><h2>Sources and further reading</h2><ul>${renderSources(x)}</ul></section>`:""}
  ${x.question?`<section class="reading-extra challenge-invite"><div class="chapter-overline">COMMANDER'S CHALLENGE</div><h2>Test your judgement</h2><p>${esc(x.exercise?.scenario||x.question)}</p><button class="primary" onclick="go('gym')">ENTER THE STRATEGY GYM →</button></section>`:""}
  <section class="reflection-panel"><div class="chapter-overline">YOUR PRIVATE REFLECTION</div><h2>What will you carry forward?</h2><p>Record the idea that changed, challenged or sharpened your thinking.</p><textarea class="field" id="lessonNote" placeholder="Your reflection…">${esc(state.notes[x.id]||"")}</textarea><div class="row"><button class="primary" onclick="saveNote('${esc(x.id)}')">SAVE REFLECTION</button><button class="ghost" onclick="complete('${esc(x.id)}')">${done?"✓ COMPLETED":"MARK AS COMPLETE"}</button></div></section>
 </article></div><footer class="academy-footer">THE MORNING STRATEGIST <span>HISTORY TEACHES US TO SEE FURTHER.</span></footer>`;
}
function library(){return `<div class="eyebrow">THE ARCHIVE</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">The Library</h1><p class="muted">Your growing collection of historical masterclasses.</p><div class="row" style="margin:16px 0"><span class="tag">CLOUD LIBRARY · AUTO-SYNC</span><button class="ghost" onclick="syncPublishedEditions().then(()=>{render();toast('Cloud library refreshed.')})">REFRESH LIBRARY ↻</button></div><input class="field" id="searchLessons" placeholder="Search by person, battle, period or theme…" oninput="filterLibrary(this.value)" style="max-width:560px;margin:18px 0"><div id="libraryList" class="cards">${libraryCards(editions)}</div><div class="sectionhead"><div><div class="eyebrow">YOUR COLLECTION</div><h2>Saved editions</h2></div></div><div class="panel">${state.bookmarks.length?state.bookmarks.map(id=>`<p>★ ${esc(editions.find(x=>x.id===id)?.title||id)}</p>`).join(""):"<p class='muted small'>Bookmark an edition to keep it close at hand.</p>"}</div><div class="sectionhead"><div><div class="eyebrow">GROW THE ARCHIVE</div><h2>Import an edition</h2></div></div><div class="panel"><p class="muted small">Import a JSON edition file to add future Morning Strategist lessons. Export your data regularly to keep a backup of notes and progress.</p><input type="file" id="importFile" accept=".json,application/json" class="field"><div class="space"></div><button class="ghost" onclick="importEdition()">IMPORT JSON EDITION</button> <button class="ghost" onclick="exportData()">EXPORT MY DATA</button></div>`}
function libraryCards(items){return items.map(x=>`<div class="lesson-card"><img src="${x.image}" alt=""><div class="inside"><div class="tag">${x.period} · ${x.minutes} MIN</div><h3>${x.title}</h3><p class="muted small">${x.subtitle}</p><button class="ghost" onclick="state.edition=editions.findIndex(z=>z.id==='${x.id}');go('lesson')">Open edition →</button></div></div>`).join("")}
function filterLibrary(q){let found=editions.filter(x=>(x.title+" "+x.period+" "+x.theme+" "+x.subtitle).toLowerCase().includes(q.toLowerCase()));document.getElementById("libraryList").innerHTML=found.length?libraryCards(found):"<p class='muted'>No editions match that search yet.</p>"}
function atlas(){return `<div class="eyebrow">GEOGRAPHY OF POWER</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">The Strategic Atlas</h1><p class="muted">Place matters. Geography shapes opportunity, risk, supply and the limits of power.</p><div class="map-placeholder" style="margin:22px 0"><div class="map-label">THE MEDITERRANEAN · EUROPE · 1805</div></div><div class="cards"><div class="panel"><div class="eyebrow">THEATRE</div><h3>Cape Trafalgar</h3><p class="muted small">Off the southwestern coast of Spain, where Atlantic approaches meet the western Mediterranean. Control of these waters mattered to fleets moving between the Atlantic and the Mediterranean.</p></div><div class="panel"><div class="eyebrow">STRATEGIC VALUE</div><h3>Sea control</h3><p class="muted small">Naval command protected trade, constrained invasion options and gave Britain strategic freedom to support coalitions on the continent.</p></div></div><p class="muted small">Atlas note: this first release uses a schematic map panel. A fully interactive map with georeferenced battle movements is a planned next-stage feature.</p>`}
function gym(){let x=e();return `<div class="eyebrow">JUDGEMENT UNDER PRESSURE</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">The Strategy Gym</h1><p class="muted">A commander rarely chooses between good and bad. More often, the choice is between competing risks.</p><div class="panel" style="margin-top:22px"><div class="eyebrow">CASE STUDY · ${x.period}</div><h3>${x.title}: the decision</h3><p>${x.lead}</p><h3 style="font-size:22px">${esc(x.question||'What is the decisive strategic choice?')}</h3>${x.options.map((o,i)=>`<label class="choice"><input type="radio" name="decision" value="${i}" ${state.decision===i?"checked":""} onchange="state.decision=${i};state.showAnswer=false">${String.fromCharCode(65+i)}. ${o}</label>`).join("")}<div class="space"></div><button class="primary" onclick="revealDecision()">REVEAL THE ANALYSIS</button>${state.showAnswer?`<div class="feedback"><strong>${state.decision===x.answer?"A sound reading of the strategic logic.":"Consider the trade-off again."}</strong><p>${x.explanation}</p><p><b>Principle:</b> ${x.principle}</p></div>`:""} </div><div class="sectionhead"><div><div class="eyebrow">YOUR TRAINING</div><h2>Questions to carry forward</h2></div></div><div class="panel"><ol class="muted small"><li>What did the decision-maker know—and what remained uncertain?</li><li>Which risk was reversible, and which was existential?</li><li>What did the opponent expect, and how could that expectation be used?</li><li>What would have to be true for the bold option to work?</li></ol></div>`}
function journal(){let entries=Object.entries(state.notes).filter(([k,v])=>v.trim());return `<div class="eyebrow">PRIVATE NOTEBOOK</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">My Strategic Journal</h1><p class="muted">Capture the ideas worth keeping. Your notes are stored on this device.</p><div class="panel" style="margin:22px 0"><div class="eyebrow">QUICK REFLECTION</div><select class="field" id="journalEdition">${editions.map(x=>`<option value="${x.id}">${x.title}</option>`).join("")}</select><div class="space"></div><textarea class="field" id="quickNote" placeholder="What are you thinking about?"></textarea><div class="space"></div><button class="primary" onclick="quickSave()">SAVE ENTRY</button></div><div class="sectionhead"><div><div class="eyebrow">YOUR RECORD</div><h2>Previous reflections</h2></div><span class="muted small">${entries.length} entries</span></div>${entries.length?entries.map(([id,n])=>`<div class="panel" style="margin-bottom:10px"><div class="tag">${esc(editions.find(x=>x.id===id)?.title||id)}</div><p style="white-space:pre-wrap;color:#d4cbb9">${esc(n)}</p><button class="ghost" onclick="state.edition=editions.findIndex(x=>x.id==='${id}');go('lesson')">Open lesson →</button></div>`).join(""):"<div class='panel muted small'>Your journal is waiting for its first entry.</div>"}<div class="space"></div><button class="ghost" onclick="exportData()">EXPORT JOURNAL & PROGRESS</button>`}
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];localStorage.setItem("ms_bookmarks",JSON.stringify(state.bookmarks));render();toast("Your library has been updated.")}
function saveNote(id){state.notes[id]=document.getElementById("lessonNote").value;localStorage.setItem("ms_notes",JSON.stringify(state.notes));toast("Reflection saved on this device.")}
function quickSave(){let id=document.getElementById("journalEdition").value,n=document.getElementById("quickNote").value.trim();if(!n)return toast("Write a reflection first.");state.notes[id]=n;localStorage.setItem("ms_notes",JSON.stringify(state.notes));render();toast("Journal entry saved.")}
function complete(id){if(!state.completed.includes(id))state.completed.push(id);localStorage.setItem("ms_completed",JSON.stringify(state.completed));render();toast("Masterclass marked complete.")}
function revealDecision(){if(state.decision===null)return toast("Choose an option first.");state.showAnswer=true;render()}
function shareEdition(){if(navigator.share)navigator.share({title:e().title,text:"The Morning Strategist — "+e().subtitle,url:location.href}).catch(()=>{});else{navigator.clipboard?.writeText(location.href);toast("Page link copied where supported.")}}
function exportData(){let data={version:1,completed:state.completed,bookmarks:state.bookmarks,notes:state.notes,editions};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="morning-strategist-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importEdition(){let f=document.getElementById("importFile").files[0];if(!f)return toast("Choose a JSON file first.");let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);let list=Array.isArray(d)?d:(d.editions||[d]);let valid=list.filter(x=>x.id&&x.title&&x.sections&&x.timeline);if(!valid.length)throw Error();valid.forEach(x=>{let i=editions.findIndex(y=>y.id===x.id);if(i>=0)editions[i]=x;else editions.push(x)});toast(valid.length+" edition(s) imported.");render()}catch(e){toast("Could not read this edition format.")}};r.readAsText(f)}
document.getElementById("todayDate").textContent=new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"Europe/Zurich"}).format(new Date()).toUpperCase();
render();
syncPublishedEditions();
let deferredPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").style.display="inline";});document.getElementById("installBtn").addEventListener("click",async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body></html>
