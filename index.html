const editions = [{
 id:"001",date:"18 November 2026",title:"Nelson at Trafalgar",subtitle:"The commander who changed the geometry of naval warfare",period:"Napoleonic Wars",theme:"Initiative · Disruption · Command",minutes:18,
 image:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=85",
 lead:"On 21 October 1805, off the coast of Spain, two fleets converged in a contest that would decide who commanded the sea. Horatio Nelson entered the battle with a plan that rejected the comfortable logic of the line—and accepted extraordinary personal risk.",
 sections:[
 {heading:"The world before Trafalgar",body:"Britain's survival as a great power depended on command of the sea. Napoleon's France dominated much of continental Europe, but an invasion of Britain required control of the Channel and the defeat or neutralisation of the Royal Navy. The Franco-Spanish fleet offered Napoleon a possible instrument for changing the balance. Trafalgar was therefore not simply a fleet action: it was a collision between continental ambition and Britain's maritime shield."},
 {heading:"The man behind the signal",body:"Nelson's command style was shaped by years at sea, hard campaigning and a close-knit network of officers who understood his intentions. He valued initiative and trust. His captains were expected to act intelligently when communications failed, rather than wait passively for instructions. This approach—later associated with mission command—was not a modern invention, but Nelson made it unusually effective through relationships, rehearsal and shared purpose."},
 {heading:"The geometry of the attack",body:"Conventional naval doctrine favoured opposing fleets sailing in parallel lines and exchanging broadsides. Nelson instead divided his fleet into two columns and drove them into the allied line at near right angles. The approach exposed the British ships to fire as they closed, but promised to rupture the enemy formation, create local superiority and make coordinated response difficult. It was a calculated exchange: accept concentrated danger briefly to create decisive disorder."},
 {heading:"Victory and its price",body:"The British victory was decisive. The combined fleet lost ships and the capacity to challenge British command of the sea in the same way. Yet Nelson was shot by a French marksman and died aboard HMS Victory. His death became part of the story, but the deeper legacy lay in the system he had built: trained captains, delegated initiative, clear intent and a willingness to act before the opponent could recover."}
 ],
 timeline:[
 ["06:00","The fleets prepare","The British fleet closes with the combined Franco-Spanish force off Cape Trafalgar."],
 ["11:45","The signal is hoisted","Nelson's famous signal—“England expects that every man will do his duty”—is sent from HMS Victory."],
 ["12:00","The lines are broken","British columns penetrate the allied line, producing close and confused fighting."],
 ["Afternoon","The battle turns","The allied fleet is defeated. Nelson is mortally wounded and dies later that day."]
 ],
 question:"Why did Nelson accept the danger of approaching the enemy line under fire?",
 options:["Because he believed speed and surprise would create local superiority and break coordination.","Because British ships had longer-range guns and could safely remain outside enemy range.","Because he wanted to preserve a perfectly parallel formation."],
 answer:0,
 explanation:"Nelson traded short-term exposure for the chance to rupture the enemy's formation. The central idea was to create a decisive local advantage before the opposing fleet could respond coherently.",
 principle:"Concentrate strength at the decisive point. A force that is stronger everywhere in theory may be weaker at the point and moment that matter.",
 modern:"In business, a smaller team can challenge an incumbent by focusing resources on one neglected customer need or bottleneck—provided it understands the risk of the concentrated move."
}];
let state={page:"home",edition:0,completed:JSON.parse(localStorage.getItem("ms_completed")||"[]"),bookmarks:JSON.parse(localStorage.getItem("ms_bookmarks")||"[]"),notes:JSON.parse(localStorage.getItem("ms_notes")||"{}"),readingProgress:JSON.parse(localStorage.getItem("ms_reading_progress")||"{}"),readingLarge:localStorage.getItem("ms_reading_large")==="1",readingWide:localStorage.getItem("ms_reading_wide")==="1",atlasTheatre:"khwarazm",decision:null,showAnswer:false,timeline:0,commandChoice:null,commandRevealed:false};

const e=()=>editions[state.edition];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function restoreEditionCache(){
 try{const cached=JSON.parse(localStorage.getItem("ms_editions_cache")||"[]");if(Array.isArray(cached))cached.forEach(lesson=>{if(!lesson||!lesson.id||!lesson.title)return;const i=editions.findIndex(x=>String(x.id)===String(lesson.id));if(i>=0)editions[i]=lesson;else editions.push(lesson);});editions.sort((x,y)=>Date.parse(y.date||"")-Date.parse(x.date||""));state.edition=0;}catch(err){console.warn("Could not restore saved editions",err);}
}
restoreEditionCache();
async function syncPublishedEditions(){
 const label=document.getElementById("streakLabel"),activeId=e().id;
 try{
  const res=await fetch(SUPABASE_URL+"/rest/v1/editions?select=id,edition_date,title,content,published_at&published_at=not.is.null&order=published_at.desc",{headers:{apikey:SUPABASE_PUBLISHABLE_KEY},cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const rows=await res.json();let changed=false;
  for(const row of rows){if(!row.content||!row.content.id||!row.content.title)continue;const lesson=Object.assign({},row.content,{id:String(row.content.id),date:row.edition_date||row.content.date||"",image:row.content.image||row.content.image_url||""});const at=editions.findIndex(x=>String(x.id)===String(lesson.id));if(at>=0){if(JSON.stringify(editions[at])!==JSON.stringify(lesson))changed=true;editions[at]=lesson;}else{editions.push(lesson);changed=true;}}
  editions.sort((x,y)=>Date.parse(y.date||"")-Date.parse(x.date||""));
  state.edition=state.page==="lesson"?Math.max(0,editions.findIndex(x=>String(x.id)===String(activeId))):0;
  try{localStorage.setItem("ms_editions_cache",JSON.stringify(editions.slice(0,20)));}catch(cacheError){console.warn("Edition cache full",cacheError);}
  label.textContent="SYNCED · "+rows.length+" EDITION"+(rows.length===1?"":"S");label.title="Published editions synced. Recent editions are saved on this device for offline reading.";
  if(changed&&state.page!=="lesson")render();
 }catch(err){label.textContent="OFFLINE / SAVED LIBRARY";label.title="Cloud sync unavailable ("+err.message+"). Showing editions last saved on this device.";}
}

 const iso=/^\d{4}-\d{2}-\d{2}$/.test(rawDate)?rawDate:(()=>{const m=rawDate.match(/^(\d{1,2}) ([A-Za-z]+) (\d{4})$/);return m?new Date(Date.parse(m[2]+" 1, "+m[3])).getFullYear()+"-"+String(new Date(Date.parse(m[2]+" 1, "+m[3])).getMonth()+1).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0"):"";})();
 const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
 const isToday=iso===today;
 const dateLabel=iso?new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(iso+"T12:00:00Z")):"Date to be confirmed";
 const sections=editionSections(x);
 return `
 <div class="academy-kicker"><span>THE EDITORIAL ACADEMY</span><span class="kicker-rule"></span><span>${isToday?"TODAY'S EDITION":"LATEST PUBLISHED EDITION"}</span></div>
 <section class="today-hero" style="--hero-image:url('${esc(x.image||x.cover?.url||"")}')">
  <div class="today-hero-shade"></div><div class="today-hero-copy">
   <div class="edition-mark">EDITION ${esc(x.id)} <i>·</i> ${esc(x.period||"HISTORY & STRATEGY")}</div>
   <h1>${esc(x.title||"The Morning Strategist")}</h1>
   <p class="hero-deck">${esc(x.subtitle||"A daily study of history, power and strategic judgement.")}</p>
   <div class="hero-byline"><span>${esc(dateLabel)}</span><span>${esc(x.minutes||15)} MIN READ</span><span>${sections.length||1} CHAPTERS</span></div>
   <div class="hero-actions"><button class="primary" onclick="${state.readingProgress[x.id]!==undefined&&!done?"continueLesson()":"go('lesson')"}">${state.readingProgress[x.id]!==undefined&&!done?"CONTINUE FROM CHAPTER "+(Number(state.readingProgress[x.id])+1):done?"REVISIT MASTERCLASS":"READ THE MASTERCLASS"} <b>→</b></button><button class="hero-save" onclick="toggleBookmark('${esc(x.id)}')">${state.bookmarks.includes(x.id)?"★ SAVED":"☆ SAVE EDITION"}</button></div>
  </div>
 </section>
 <div class="home-intro-grid">
  <section class="editorial-intro"><div class="section-index">01 / THE DAILY STUDY</div><h2>History teaches us<br><em>to see further.</em></h2><p>Go beyond the familiar account. Enter the world behind the event, understand the person behind the decision, and examine the choices that changed the course of history.</p><button class="text-link" onclick="go('lesson')">Begin today's study <span>↗</span></button></section>

 </div>

  <button class="pathway-card" onclick="go('gym')"><span>JUDGEMENT UNDER PRESSURE</span><strong>Strategy Gym</strong><small>Test your reasoning against difficult strategic choices.</small><b>Train ↗</b></button>

 <footer class="academy-footer">THE MORNING STRATEGIST <span>THINK CLEARLY. SEE FURTHER. ACT DECISIVELY.</span></footer>`;
}

function splitReadingChunks(value){
 const blocks=String(value||"").split(/\n\s*\n/).map(part=>part.trim()).filter(Boolean),chunks=[];
 blocks.forEach(block=>{if(block.split(/\s+/).length<=105){chunks.push(block);return;}const sentences=block.match(/[^.!?]+[.!?]+["'”’)]*|[^.!?]+$/g)||[block];let group="",count=0;sentences.forEach(sentence=>{const next=(group+" "+sentence).trim();if(group&&(count>=3||next.split(/\s+/).length>105)){chunks.push(group.trim());group=sentence.trim();count=1;}else{group=next;count++;}});if(group)chunks.push(group.trim());});
 return chunks;
}

 const feedback=state.commandRevealed&&selected?'<div class="command-debrief '+(selected.correct?"is-sound":"is-flawed")+'"><div class="debrief-verdict">'+(selected.correct?"YOUR PLAN HOLDS":"YOUR PLAN HAS A STRATEGIC FLAW")+'</div><h3>'+(selected.correct?"Why this works":"Why this choice fails")+'</h3><p>'+esc(selected.why||"")+'</p><div class="debrief-corrective"><span>THE STRONGER COURSE OF ACTION</span><p>'+esc(selected.better||"")+'</p></div><div class="debrief-history"><span>WHAT HAPPENED IN HISTORY</span><p>'+esc(selected.historical||"")+'</p></div><p class="debrief-close">'+(selected.correct?"A sound decision is not a risk-free decision. Notice the coordination demands and vulnerabilities you have accepted.":"The lesson is not that boldness is wrong. It is that the chosen action must solve the whole strategic problem, not just the most visible one.")+'</p></div>':"";
 const mapMarkup='<div class="command-map-wrap"><div class="command-map-title"><span>'+esc(map.label||sim.mapLabel||"THEATRE OF OPERATIONS")+'</span><span>SELECT YOUR OPERATIONAL AXIS</span></div><div class="command-map"><svg viewBox="'+viewBox+'" role="img" aria-label="'+esc(map.ariaLabel||"Schematic operational map")+'"><defs><pattern id="terrainGrid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="rgba(220,205,166,.08)" stroke-width="1"/></pattern></defs><rect width="'+width+'" height="'+height+'" fill="url(#terrainGrid)"/>'+routes+nodes+(map.regionLabel?'<text class="map-region" x="'+num(map.regionX||width/2)+'" y="'+num(map.regionY||42)+'">'+esc(map.regionLabel)+'</text>':"")+'</svg><div class="map-compass">'+esc(map.compass||"N ↑")+'</div></div><div class="map-legend"><span><i class="legend-dot"></i> Strategic position</span><span><i class="legend-line"></i> Selected route</span><span><i class="legend-origin"></i> Starting force</span></div></div>';
 return '<section class="command-sim reading-extra" id="command-simulation"><div class="command-heading"><div><div class="chapter-overline">THE COMMAND ROOM · STRATEGIC SIMULATION</div><h2>'+esc(sim.title||"The command decision")+'</h2></div><span class="command-location">'+esc(sim.location||"HISTORICAL SCENARIO")+'</span></div><p class="command-brief">'+esc(sim.briefing||"Assess the situation, select your operational plan and commit to a decision.")+'</p><div class="command-intel-grid">'+intel+'</div>'+mapMarkup+'<div class="command-options"><div class="command-options-label">ISSUE YOUR ORDERS</div>'+options+'</div><div class="command-commit-row"><span>'+(selected?"ORDERS SELECTED · "+esc(selected.label.toUpperCase()):"AWAITING YOUR ORDERS")+'</span><button class="primary" onclick="revealCommand()" '+(!selected?"disabled":"") +'>COMMIT TO THE PLAN →</button></div>'+feedback+'<div class="command-footnote">The map is a strategic schematic, not a literal contemporary document. The debrief distinguishes the historical record from the reconstruction.</div></section>';
}
function library(){return `<div class="eyebrow">THE ARCHIVE</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">The Library</h1><p class="muted">Your growing collection of historical masterclasses.</p><div class="row" style="margin:16px 0"><span class="tag">CLOUD LIBRARY · AUTO-SYNC</span><button class="ghost" onclick="syncPublishedEditions().then(()=>{render();toast('Cloud library refreshed.')})">REFRESH LIBRARY ↻</button></div><input class="field" id="searchLessons" placeholder="Search by person, battle, period or theme…" oninput="filterLibrary(this.value)" style="max-width:560px;margin:18px 0"><div id="libraryList" class="cards">${libraryCards(editions)}</div><div class="sectionhead"><div><div class="eyebrow">YOUR COLLECTION</div><h2>Saved editions</h2></div></div><div class="panel">${state.bookmarks.length?state.bookmarks.map(id=>`<p>★ ${esc(editions.find(x=>x.id===id)?.title||id)}</p>`).join(""):"<p class='muted small'>Bookmark an edition to keep it close at hand.</p>"}</div><div class="sectionhead"><div><div class="eyebrow">GROW THE ARCHIVE</div><h2>Import an edition</h2></div></div><div class="panel"><p class="muted small">Import a JSON edition file to add future Morning Strategist lessons. Export your data regularly to keep a backup of notes and progress.</p><input type="file" id="importFile" accept=".json,application/json" class="field"><div class="space"></div><button class="ghost" onclick="importEdition()">IMPORT JSON EDITION</button> <button class="ghost" onclick="exportData()">EXPORT MY DATA</button></div>`}
function libraryCards(items){return items.map(x=>{const image=/^https:\/\//i.test(x.image||x.cover?.url||"")?(x.image||x.cover.url):"",progress=state.readingProgress[x.id];return '<div class="lesson-card">'+(image?'<img src="'+esc(image)+'" alt="'+esc(x.title||"Historical masterclass")+'" loading="lazy">':'<div class="lesson-card-placeholder"><span>THE MORNING STRATEGIST</span></div>')+'<div class="inside"><div class="tag">'+esc(x.period||"HISTORY")+' · '+esc(x.minutes||15)+' MIN</div><h3>'+esc(x.title||"Untitled edition")+'</h3><p class="muted small">'+esc(x.subtitle||"")+'</p>'+(progress!==undefined?'<p class="library-progress">LAST READ · CHAPTER '+(Number(progress)+1)+'</p>':'')+'<button class="ghost" onclick="state.edition=editions.findIndex(z=>String(z.id)===\''+esc(x.id)+'\');go(\'lesson\')">Open edition →</button></div></div>';}).join("")}
function filterLibrary(q){const query=String(q||"").trim().toLowerCase();let found=editions.filter(x=>[x.title,x.period,x.theme,x.subtitle,x.lead,x.date,...(x.chapters||x.sections||[]).map(v=>v.heading||v.title||"")].join(" ").toLowerCase().includes(query));document.getElementById("libraryList").innerHTML=found.length?libraryCards(found):"<p class='muted'>No editions match that search yet.</p>"}

function selectAtlas(theatre){state.atlasTheatre=theatre;render();}
function atlas(){
 const kh=state.atlasTheatre!=="trafalgar";
 const map=kh
 ? "<svg viewBox='0 0 900 480' role='img' aria-label='Schematic map of the Mongol campaign across Central Asia'><defs><pattern id='atlasTerrain' width='32' height='32' patternUnits='userSpaceOnUse'><path d='M32 0H0V32' fill='none' stroke='#d6c49c' stroke-opacity='.08'/></pattern></defs><rect width='900' height='480' fill='#202a25'/><rect width='900' height='480' fill='url(#atlasTerrain)'/><path d='M0 85 Q130 40 235 115 T460 120 T690 90 T900 145' fill='none' stroke='#668b8b' stroke-width='24' opacity='.16'/><path d='M0 85 Q130 40 235 115 T460 120 T690 90 T900 145' fill='none' stroke='#7ca5a2' stroke-width='2' stroke-dasharray='5 9' opacity='.6'/><path d='M80 350 Q180 285 305 210' fill='none' stroke='#d5bd8d' stroke-width='3' stroke-dasharray='8 8'/><path d='M80 350 Q310 390 530 315 M80 350 Q350 210 690 185' fill='none' stroke='#d5bd8d' stroke-width='3' stroke-dasharray='8 8'/><g fill='#d5bd8d' stroke='#171a19' stroke-width='4'><circle cx='305' cy='210' r='9'/><circle cx='530' cy='315' r='9'/><circle cx='690' cy='185' r='9'/><circle cx='80' cy='350' r='12'/></g><g fill='#eee8da' font-family='Arial' font-size='14' letter-spacing='2'><text x='325' y='214'>OTRAR</text><text x='550' y='319'>BUKHARA</text><text x='710' y='189'>SAMARKAND</text><text x='100' y='372'>MONGOL ASSEMBLY</text></g><g fill='#b9c8b9' opacity='.65' font-family='Georgia' font-size='16' letter-spacing='3'><text x='375' y='60'>KHWAREZMIAN EMPIRE</text><text x='365' y='445'>KYZYLKUM DESERT</text></g></svg>"
 : "<svg viewBox='0 0 900 480' role='img' aria-label='Schematic map of the Battle of Trafalgar showing British columns breaking the allied line'><defs><pattern id='seaGrid' width='36' height='36' patternUnits='userSpaceOnUse'><path d='M36 0H0V36' fill='none' stroke='#d6c49c' stroke-opacity='.07'/></pattern></defs><rect width='900' height='480' fill='#1d2a2b'/><rect width='900' height='480' fill='url(#seaGrid)'/><path d='M700 0 Q675 100 730 190 T710 480 L900 480 L900 0Z' fill='#857e69' opacity='.32'/><path d='M700 0 Q675 100 730 190 T710 480' fill='none' stroke='#b5a783' stroke-width='3'/><path d='M200 125 L670 125 M190 155 L660 155' stroke='#c58b76' stroke-width='5' stroke-dasharray='11 7' opacity='.8'/><path d='M270 420 Q390 300 460 155 M380 450 Q500 320 520 155' stroke='#d5bd8d' stroke-width='5' fill='none' stroke-dasharray='12 8'/><g fill='#d5bd8d' stroke='#171a19' stroke-width='4'><circle cx='270' cy='420' r='11'/><circle cx='380' cy='450' r='11'/></g><g fill='#eee8da' font-family='Arial' font-size='14' letter-spacing='2'><text x='110' y='100'>ALLIED FLEET · LINE AHEAD</text><text x='300' y='290'>BRITISH LEE COLUMN</text><text x='520' y='360'>BRITISH WEATHER COLUMN</text><text x='725' y='225'>SPANISH COAST</text><text x='60' y='455'>ATLANTIC APPROACH</text></g><text x='355' y='45' fill='#b9c8b9' opacity='.65' font-family='Georgia' font-size='16' letter-spacing='3'>CAPE TRAFALGAR · 21 OCTOBER 1805</text></svg>";
 const title=kh?"The Khwarazm campaign":"The Battle of Trafalgar";
 const subtitle=kh?"Central Asia · 1219–1221":"Off the coast of Spain · 21 October 1805";
 const insight=kh?"The Mongols did not allow one fortress to dictate the campaign. Multiple columns forced the Shah to respond across a vast theatre, while surprise and mobility disrupted the empire’s ability to coordinate.":"Nelson’s two columns accepted a dangerous approach under fire to rupture the allied line. The aim was not simply to hit harder, but to break the opponent’s formation and create local superiority.";
 return "<div class='eyebrow'>GEOGRAPHY OF POWER</div><h1 class='atlas-title'>The Strategic Atlas</h1><p class='atlas-deck'>A campaign is never fought on a blank page. Explore how terrain, distance, routes and position shape the choices available to a commander.</p><div class='atlas-tabs'><button class='"+(kh?"active":"")+"' onclick=\"selectAtlas('khwarazm')\">CENTRAL ASIA · 1219</button><button class='"+(!kh?"active":"")+"' onclick=\"selectAtlas('trafalgar')\">TRAFALGAR · 1805</button></div><section class='atlas-map-panel'><div class='atlas-map-heading'><span>"+title+"</span><small>"+subtitle+"</small></div><div class='atlas-map'>"+map+"</div><div class='atlas-map-note'>OPERATIONAL SCHEMATIC · NOT TO SCALE · ROUTES SIMPLIFIED FOR STUDY</div></section><div class='atlas-insight-grid'><section class='panel'><div class='eyebrow'>THE THEATRE</div><h3>"+title+"</h3><p class='muted small'>"+(kh?"Otrar, Bukhara and Samarkand sat across a wide imperial landscape. The Kyzylkum desert was a barrier, but also an avenue of surprise for a force prepared to cross it.":"The battle took place west of Cape Trafalgar, where the Atlantic approaches the Strait of Gibraltar. Wind, sea room, fleet formation and the proximity of the coast all shaped the tactical problem.")+"</p></section><section class='panel'><div class='eyebrow'>THE STRATEGIC GEOMETRY</div><h3>"+(kh?"Disperse to dislocate":"Break the line")+"</h3><p class='muted small'>"+insight+"</p></section></div><div class='atlas-footer-note'>These are explanatory diagrams, not navigational charts or exact reconstructions of every unit movement. Use them to understand the strategic geometry; the masterclass sources provide the historical detail.</div>";
}
function gym(){const x=e();const sim=renderCommandSimulation(x);return '<div class="eyebrow">JUDGEMENT UNDER PRESSURE</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">The Strategy Gym</h1><p class="muted">Enter the command room. Read the intelligence, study the terrain and issue your orders. The debrief will explain the strategic logic and the historical decision.</p>'+(sim||'<div class="panel" style="margin-top:22px"><h3>No command simulation is attached to this edition yet.</h3><p class="muted">New editions can include a custom visual command scenario. Return to the masterclass for the historical narrative and strategic analysis.</p><button class="ghost" onclick="go(\'lesson\')">RETURN TO MASTERCLASS →</button></div>');}function journal(){let entries=Object.entries(state.notes).filter(([k,v])=>v.trim());return `<div class="eyebrow">PRIVATE NOTEBOOK</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">My Strategic Journal</h1><p class="muted">Capture the ideas worth keeping. Your notes are stored on this device.</p><div class="panel" style="margin:22px 0"><div class="eyebrow">QUICK REFLECTION</div><select class="field" id="journalEdition">${editions.map(x=>`<option value="${x.id}">${x.title}</option>`).join("")}</select><div class="space"></div><textarea class="field" id="quickNote" placeholder="What are you thinking about?"></textarea><div class="space"></div><button class="primary" onclick="quickSave()">SAVE ENTRY</button></div><div class="sectionhead"><div><div class="eyebrow">YOUR RECORD</div><h2>Previous reflections</h2></div><span class="muted small">${entries.length} entries</span></div>${entries.length?entries.map(([id,n])=>`<div class="panel" style="margin-bottom:10px"><div class="tag">${esc(editions.find(x=>x.id===id)?.title||id)}</div><p style="white-space:pre-wrap;color:#d4cbb9">${esc(n)}</p><button class="ghost" onclick="state.edition=editions.findIndex(x=>x.id==='${id}');go('lesson')">Open lesson →</button></div>`).join(""):"<div class='panel muted small'>Your journal is waiting for its first entry.</div>"}<div class="space"></div><button class="ghost" onclick="exportData()">EXPORT JOURNAL & PROGRESS</button>`}
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];localStorage.setItem("ms_bookmarks",JSON.stringify(state.bookmarks));render();toast("Your library has been updated.")}
function toggleReadingSize(){state.readingLarge=!state.readingLarge;localStorage.setItem("ms_reading_large",state.readingLarge?"1":"0");render();}
function toggleReadingWidth(){state.readingWide=!state.readingWide;localStorage.setItem("ms_reading_wide",state.readingWide?"1":"0");render();}
function initReadingProgress(){const x=e(),chapters=[...document.querySelectorAll(".reading-chapter")];if(!chapters.length)return;const label=document.getElementById("readingProgressLabel"),fill=document.getElementById("readingProgressFill");const update=index=>{const value=Math.max(0,Math.min(chapters.length-1,index));state.readingProgress[x.id]=value;localStorage.setItem("ms_reading_progress",JSON.stringify(state.readingProgress));if(label)label.textContent=(value+1)+" OF "+chapters.length+" CHAPTERS";if(fill)fill.style.width=((value+1)/chapters.length*100)+"%";};if(!("IntersectionObserver" in window)){update(0);return;}const observer=new IntersectionObserver(entries=>{const visible=entries.filter(v=>v.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(visible){const index=chapters.indexOf(visible.target);if(index>=0)update(index);}},{rootMargin:"-12% 0px -72% 0px",threshold:0});chapters.forEach(ch=>observer.observe(ch));}
function saveNote(id){state.notes[id]=document.getElementById("lessonNote").value;localStorage.setItem("ms_notes",JSON.stringify(state.notes));toast("Reflection saved on this device.")}
function quickSave(){let id=document.getElementById("journalEdition").value,n=document.getElementById("quickNote").value.trim();if(!n)return toast("Write a reflection first.");state.notes[id]=n;localStorage.setItem("ms_notes",JSON.stringify(state.notes));render();toast("Journal entry saved.")}
function complete(id){if(!state.completed.includes(id))state.completed.push(id);const item=editions.find(x=>String(x.id)===String(id));if(item){state.readingProgress[id]=Math.max(0,editionSections(item).length-1);localStorage.setItem("ms_reading_progress",JSON.stringify(state.readingProgress));}localStorage.setItem("ms_completed",JSON.stringify(state.completed));render();toast("Masterclass marked complete.")}
function revealDecision(){if(state.decision===null)return toast("Choose an option first.");state.showAnswer=true;render()}
function shareEdition(){if(navigator.share)navigator.share({title:e().title,text:"The Morning Strategist — "+e().subtitle,url:location.href}).catch(()=>{});else{navigator.clipboard?.writeText(location.href);toast("Page link copied where supported.")}}
function exportData(){let data={version:2,completed:state.completed,bookmarks:state.bookmarks,notes:state.notes,readingProgress:state.readingProgress,readingLarge:state.readingLarge,readingWide:state.readingWide,editions};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="morning-strategist-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importEdition(){const f=document.getElementById("importFile").files[0];if(!f)return toast("Choose a JSON backup or edition file first.");const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),list=Array.isArray(d)?d:(Array.isArray(d.editions)?d.editions:[d]),valid=list.filter(x=>x&&x.id&&x.title&&(Array.isArray(x.chapters)||Array.isArray(x.sections)));if(!valid.length)throw Error("No valid editions");valid.forEach(x=>{const n=editions.findIndex(y=>String(y.id)===String(x.id));if(n>=0)editions[n]=x;else editions.push(x);});if(Array.isArray(d.completed))state.completed=d.completed;if(Array.isArray(d.bookmarks))state.bookmarks=d.bookmarks;if(d.notes&&typeof d.notes==="object")state.notes=d.notes;if(d.readingProgress&&typeof d.readingProgress==="object")state.readingProgress=d.readingProgress;if(typeof d.readingLarge==="boolean")state.readingLarge=d.readingLarge;if(typeof d.readingWide==="boolean")state.readingWide=d.readingWide;localStorage.setItem("ms_completed",JSON.stringify(state.completed));localStorage.setItem("ms_bookmarks",JSON.stringify(state.bookmarks));localStorage.setItem("ms_notes",JSON.stringify(state.notes));localStorage.setItem("ms_reading_progress",JSON.stringify(state.readingProgress));localStorage.setItem("ms_reading_large",state.readingLarge?"1":"0");localStorage.setItem("ms_reading_wide",state.readingWide?"1":"0");editions.sort((a,b)=>Date.parse(b.date||"")-Date.parse(a.date||""));localStorage.setItem("ms_editions_cache",JSON.stringify(editions.slice(0,20)));state.edition=0;toast("Backup restored: "+valid.length+" edition(s).");render();}catch(err){toast("Could not read this backup. Check that it is a Morning Strategist JSON file.");}};r.readAsText(f);}
document.getElementById("todayDate").textContent=new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"Europe/Zurich"}).format(new Date()).toUpperCase();
render();
syncPublishedEditions();
let deferredPrompt;const installButton=document.getElementById("installBtn");if(window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true)installButton.style.display="none";window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installButton.textContent="↓ INSTALL";});installButton.addEventListener("click",async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}else{alert("To add The Morning Strategist to your home screen on Android: open Chrome’s ⋮ menu, choose ‘Install app’ or ‘Add to Home screen’, then confirm.");}});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
