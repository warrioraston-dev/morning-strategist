   map:{width:760,height:390,label:"THEATRE OF OPERATIONS · SCHEMATIC, NOT TO SCALE",nodes:[{id:"assembly",label:"MONGOL ASSEMBLY",x:85,y:310,type:"origin",labelX:105,labelY:330},{id:"otrar",label:"OTRAR",x:260,y:190},{id:"bukhara",label:"BUKHARA",x:470,y:270},{id:"samarkand",label:"SAMARKAND",x:555,y:165},{id:"shah",label:"SHAH'S FLIGHT",x:650,y:70}],routes:[{id:"siege",points:[[85,310],[160,260],[260,190]]},{id:"columns-otrar",points:[[85,310],[155,230],[260,190]]},{id:"columns-bukhara",points:[[85,310],[300,340],[470,270]]},{id:"columns-samarkand",points:[[85,310],[340,170],[555,165]]},{id:"pursuit",points:[[85,310],[330,45],[650,70]]}]},
   briefing:"You command the Mongol expedition. The Khwarazmian Empire is vast, its major cities are fortified, and its ruler Muhammad II has forces spread across the territory. The massacre of the Mongol trade mission at Otrar has given you a reason to invade. Your challenge is not simply to win a siege: it is to prevent the Shah from concentrating his forces and turning the campaign into a prolonged war.",
   intelligence:["Otrar is strongly defended and must be dealt with.","The Shah's forces are dispersed across a large territory.","The desert routes are dangerous, but may offer strategic surprise.","Your columns can move independently if their objectives and timing are clear."],
   options:[
    {id:"siege",routeIds:["siege"],label:"Concentrate on Otrar",detail:"Bring the main army against the frontier fortress. Break the gate before advancing deeper.",correct:false,why:"A concentrated siege makes Otrar the centre of gravity and gives the Shah time to understand your direction, gather forces and prepare elsewhere. Otrar does need to be contained, but making it the whole campaign risks allowing one fortress to dictate your tempo.",better:"Contain Otrar with a dedicated force while the rest of the army advances on several axes. A siege should not immobilise the entire campaign.",historical:"Historically, Otrar was besieged while other Mongol forces advanced elsewhere. Chagatai and Ögedei were assigned the siege; Genghis Khan and Tolui moved through the Kyzylkum desert toward Bukhara."},
    {id:"columns",routeIds:["columns-otrar","columns-bukhara","columns-samarkand"],label:"Advance on several axes",detail:"Isolate Otrar while separate columns move toward the empire's other centres, including through routes the enemy considers unlikely.",correct:true,why:"This plan attacks the enemy's ability to coordinate. It forces the Shah to respond to several threats, prevents one fortress from absorbing your whole army and uses mobility and surprise to create simultaneous crises. It is demanding: independent columns need clear objectives, intelligence and disciplined coordination.",better:"This is the strongest operational design: contain Otrar, advance on multiple axes and preserve the ability to concentrate locally when an opportunity appears.",historical:"This most closely reflects the Mongol operational design. The campaign used several coordinated forces; the crossing of the Kyzylkum toward Bukhara was especially unexpected. The exact routes and command arrangements were more complex than a simple three-pronged diagram."},
    {id:"pursuit",routeIds:["pursuit"],label:"Hunt the Shah directly",detail:"Avoid the fortified cities and move rapidly to capture or destroy the ruler's field army.",correct:false,why:"The Shah is a moving target. If you pursue him without disrupting the cities, garrisons and political network that sustain his power, he can evade you while the empire remains capable of resistance. A pursuit may become decisive later, but it is a poor opening move if it leaves the wider system intact.",better:"First fracture the empire's ability to coordinate: threaten its cities and communications on several axes, then exploit the Shah's isolation and flight.",historical:"The Mongols did eventually pursue Muhammad II, who fled westward. But the opening campaign first shattered the empire's urban and military structure, leaving the Shah increasingly isolated."}
   ]

 }

 if(/nelson|trafalgar/i.test((x.title||"")+" "+(x.subtitle||"")+" "+(x.lead||"")+" "+(x.period||""))){
  return {
   title:"The approach to Trafalgar",location:"Off Cape Trafalgar · 21 October 1805",
   map:{width:760,height:390,label:"FLEET DISPOSITIONS · SCHEMATIC, NOT TO SCALE",nodes:[{id:"british",label:"BRITISH FLEET",x:110,y:315,type:"origin",labelX:125,labelY:340},{id:"alliedvan",label:"ALLIED VAN",x:330,y:115},{id:"alliedcentre",label:"ALLIED CENTRE",x:500,y:115},{id:"alliedrear",label:"ALLIED REAR",x:665,y:115},{id:"coast",label:"SPANISH COAST",x:700,y:300}],routes:[{id:"parallel",points:[[110,315],[230,225],[360,115]]},{id:"two-columns-a",points:[[80,340],[180,250],[330,115]]},{id:"two-columns-b",points:[[150,350],[330,280],[500,115]]},{id:"hold",points:[[110,315],[110,240],[150,185]]}]},
   briefing:"You command the British fleet. The combined Franco-Spanish fleet lies ahead in a long line. Your objective is to defeat its ability to operate as a coherent force and prevent it from threatening British command of the sea. You know your captains are capable and your crews are well trained, but the approach will expose your ships to enemy fire. The wind is imperfect and signals may be difficult to interpret once battle begins.",
   intelligence:["The allied fleet is deployed in a line ahead, with ships close enough to support one another if formation holds.","British crews are experienced, but ships must cross the enemy broadside arcs to reach close action.","The allied fleet is larger on paper, but coordination and morale are uncertain.","Once the lines close, smoke, noise and damage will make centralised control increasingly difficult."],
   options:[
    {id:"parallel",routeIds:["parallel"],label:"Engage in a parallel line",detail:"Form opposite the enemy and exchange broadsides along the length of the line.",correct:false,why:"This preserves a familiar formation but also allows the combined fleet to fight on its preferred terms. The enemy can bring much of its broadside strength to bear, while the battle risks becoming a long exchange in which the British advantage in training and initiative is less decisive. A parallel engagement is not always wrong; it is simply a poor way to create the disruption you need here.",better:"Seek to rupture the allied line at selected points, creating close engagements where British ships can overwhelm isolated sections before the rest of the fleet can respond.",historical:"Nelson chose to attack in two columns, approaching the allied line at near right angles. His plan was dangerous because the British ships endured fire while closing, but it aimed to break the enemy formation."},

    {id:"hold",routeIds:["hold"],label:"Hold outside effective range",detail:"Preserve the fleet, wait for a better wind and force the allied commander to make the first move.",correct:false,why:"Waiting protects the fleet from immediate exposure, but it also surrenders initiative. The allied fleet may regain freedom to manoeuvre, avoid battle or move toward its strategic objective. Delay can be a sound choice when intelligence is poor or conditions are prohibitive; here, however, it risks allowing the opponent to choose when and where the decisive encounter occurs.",better:"Use the available conditions to close and force the engagement, while accepting that the timing and exact geometry will not be perfect.",historical:"Nelson did not wait for ideal conditions. He committed to the approach and trusted the experience and initiative of his captains. The plan’s success depended on execution, not on certainty."}
   ]
  };
 }
 return null;
}

 return "<div class='eyebrow'>GEOGRAPHY OF POWER</div><h1 class='atlas-title'>The Strategic Atlas</h1><p class='atlas-deck'>A campaign is never fought on a blank page. Explore how terrain, distance, routes and position shape the choices available to a commander.</p><div class='atlas-tabs'><button class='"+(kh?"active":"")+"' onclick=\"selectAtlas('khwarazm')\">CENTRAL ASIA · 1219</button><button class='"+(!kh?"active":"")+"' onclick=\"selectAtlas('trafalgar')\">TRAFALGAR · 1805</button></div><section class='atlas-map-panel'><div class='atlas-map-heading'><span>"+title+"</span><small>"+subtitle+"</small></div><div class='atlas-map'>"+map+"</div><div class='atlas-map-note'>OPERATIONAL SCHEMATIC · NOT TO SCALE · ROUTES SIMPLIFIED FOR STUDY</div></section><div class='atlas-insight-grid'><section class='panel'><div class='eyebrow'>THE THEATRE</div><h3>"+title+"</h3><p class='muted small'>"+(kh?"Otrar, Bukhara and Samarkand sat across a wide imperial landscape. The Kyzylkum desert was a barrier, but also an avenue of surprise for a force prepared to cross it.":"The battle took place west of Cape Trafalgar, where the Atlantic approaches the Strait of Gibraltar. Wind, sea room, fleet formation and the proximity of the coast all shaped the tactical problem.")+"</p></section><section class='panel'><div class='eyebrow'>THE STRATEGIC GEOMETRY</div><h3>"+(kh?"Disperse to dislocate":"Break the line")+"</h3><p class='muted small'>"+insight+"</p></section></div><div class='atlas-footer-note'>These are explanatory diagrams, not navigational charts or exact reconstructions of every unit movement. Use them to understand the strategic geometry; the masterclass sources provide the historical detail.</div>";
}
function gym(){const x=e();const sim=renderCommandSimulation(x);return '<div class="eyebrow">JUDGEMENT UNDER PRESSURE</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">The Strategy Gym</h1><p class="muted">Enter the command room. Read the intelligence, study the terrain and issue your orders. The debrief will explain the strategic logic and the historical decision.</p>'+(sim||'<div class="panel" style="margin-top:22px"><h3>No command simulation is attached to this edition yet.</h3><p class="muted">New editions can include a custom visual command scenario. Return to the masterclass for the historical narrative and strategic analysis.</p><button class="ghost" onclick="go(\'lesson\')">RETURN TO MASTERCLASS →</button></div>');}function journal(){let entries=Object.entries(state.notes).filter(([k,v])=>v.trim());return `<div class="eyebrow">PRIVATE NOTEBOOK</div><h1 style="font:48px var(--serif);font-weight:400;margin:8px 0">My Strategic Journal</h1><p class="muted">Capture the ideas worth keeping. Your notes are stored on this device.</p><div class="panel" style="margin:22px 0"><div class="eyebrow">QUICK REFLECTION</div><select class="field" id="journalEdition">${editions.map(x=>`<option value="${x.id}">${x.title}</option>`).join("")}</select><div class="space"></div><textarea class="field" id="quickNote" placeholder="What are you thinking about?"></textarea><div class="space"></div><button class="primary" onclick="quickSave()">SAVE ENTRY</button></div><div class="sectionhead"><div><div class="eyebrow">YOUR RECORD</div><h2>Previous reflections</h2></div><span class="muted small">${entries.length} entries</span></div>${entries.length?entries.map(([id,n])=>`<div class="panel" style="margin-bottom:10px"><div class="tag">${esc(editions.find(x=>x.id===id)?.title||id)}</div><p style="white-space:pre-wrap;color:#d4cbb9">${esc(n)}</p><button class="ghost" onclick="state.edition=editions.findIndex(x=>x.id==='${id}');go('lesson')">Open lesson →</button></div>`).join(""):"<div class='panel muted small'>Your journal is waiting for its first entry.</div>"}<div class="space"></div><button class="ghost" onclick="exportData()">EXPORT JOURNAL & PROGRESS</button>`}
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];localStorage.setItem("ms_bookmarks",JSON.stringify(state.bookmarks));render();toast("Your library has been updated.")}
function toggleReadingSize(){state.readingLarge=!state.readingLarge;localStorage.setItem("ms_reading_large",state.readingLarge?"1":"0");render();}
function toggleReadingWidth(){state.readingWide=!state.readingWide;localStorage.setItem("ms_reading_wide",state.readingWide?"1":"0");render();}
function initReadingProgress(){const x=e(),chapters=[...document.querySelectorAll(".reading-chapter")];if(!chapters.length)return;const label=document.getElementById("readingProgressLabel"),fill=document.getElementById("readingProgressFill");const update=index=>{const value=Math.max(0,Math.min(chapters.length-1,index));state.readingProgress[x.id]=value;localStorage.setItem("ms_reading_progress",JSON.stringify(state.readingProgress));if(label)label.textContent=(value+1)+" OF "+chapters.length+" CHAPTERS";if(fill)fill.style.width=((value+1)/chapters.length*100)+"%";};if(!("IntersectionObserver" in window)){update(0);return;}if(readingObserver)readingObserver.disconnect();readingObserver=new IntersectionObserver(entries=>{const visible=entries.filter(v=>v.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(visible){const index=chapters.indexOf(visible.target);if(index>=0)update(index);}},{rootMargin:"-12% 0px -72% 0px",threshold:0});chapters.forEach(ch=>readingObserver.observe(ch));}
function saveNote(id){state.notes[id]=document.getElementById("lessonNote").value;localStorage.setItem("ms_notes",JSON.stringify(state.notes));toast("Reflection saved on this device.")}
function quickSave(){let id=document.getElementById("journalEdition").value,n=document.getElementById("quickNote").value.trim();if(!n)return toast("Write a reflection first.");state.notes[id]=n;localStorage.setItem("ms_notes",JSON.stringify(state.notes));render();toast("Journal entry saved.")}
function complete(id){if(!state.completed.includes(id))state.completed.push(id);const item=editions.find(x=>String(x.id)===String(id));if(item){state.readingProgress[id]=Math.max(0,editionSections(item).length-1);localStorage.setItem("ms_reading_progress",JSON.stringify(state.readingProgress));}localStorage.setItem("ms_completed",JSON.stringify(state.completed));render();toast("Masterclass marked complete.")}
function revealDecision(){if(state.decision===null)return toast("Choose an option first.");state.showAnswer=true;render()}
function shareEdition(){if(navigator.share)navigator.share({title:e().title,text:"The Morning Strategist — "+e().subtitle,url:location.href}).catch(()=>{});else{navigator.clipboard?.writeText(location.href);toast("Page link copied where supported.")}}
function exportData(){let data={version:2,completed:state.completed,bookmarks:state.bookmarks,notes:state.notes,readingProgress:state.readingProgress,readingLarge:state.readingLarge,readingWide:state.readingWide,editions};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="morning-strategist-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importEdition(){const f=document.getElementById("importFile").files[0];if(!f)return toast("Choose a JSON backup or edition file first.");const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),list=Array.isArray(d)?d:(Array.isArray(d.editions)?d.editions:[d]),valid=list.filter(x=>x&&x.id&&x.title&&(Array.isArray(x.chapters)||Array.isArray(x.sections)));if(!valid.length)throw Error("No valid editions");valid.forEach(x=>{const n=editions.findIndex(y=>String(y.id)===String(x.id));if(n>=0)editions[n]=x;else editions.push(x);});if(Array.isArray(d.completed))state.completed=d.completed;if(Array.isArray(d.bookmarks))state.bookmarks=d.bookmarks;if(d.notes&&typeof d.notes==="object")state.notes=d.notes;if(d.readingProgress&&typeof d.readingProgress==="object")state.readingProgress=d.readingProgress;if(typeof d.readingLarge==="boolean")state.readingLarge=d.readingLarge;if(typeof d.readingWide==="boolean")state.readingWide=d.readingWide;localStorage.setItem("ms_completed",JSON.stringify(state.completed));localStorage.setItem("ms_bookmarks",JSON.stringify(state.bookmarks));localStorage.setItem("ms_notes",JSON.stringify(state.notes));localStorage.setItem("ms_reading_progress",JSON.stringify(state.readingProgress));localStorage.setItem("ms_reading_large",state.readingLarge?"1":"0");localStorage.setItem("ms_reading_wide",state.readingWide?"1":"0");editions.sort((a,b)=>Date.parse(b.date||"")-Date.parse(a.date||""));localStorage.setItem("ms_editions_cache",JSON.stringify(editions.slice(0,20)));state.edition=0;toast("Backup restored: "+valid.length+" edition(s).");render();}catch(err){toast("Could not read this backup. Check that it is a Morning Strategist JSON file.");}};r.readAsText(f);}
